[project]
name = "llmobs"
version = "0.1.0"
description = "OpenTelemetry instrumentation for LLM calls: latency, tokens, estimated cost and errors, with a ready-to-run Grafana stack."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amani Chouk", email = "amanichouk6@gmail.com" }]
keywords = ["llm", "opentelemetry", "observability", "genai", "grafana"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]
demo = [
    "llmobs[otlp]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "llmobs[demo]",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmobs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "RET", "ARG", "PL", "TRY", "S"]
ignore = [
    "PLR0913",
    "TRY003",
    "PLC0415", # lazy imports keep optional extras (otlp) optional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
"benchmarks/**" = ["S311", "T201", "PLR2004"]
"examples/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "examples"]
files = ["src", "tests", "examples", "benchmarks"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=llmobs --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["integration: end-to-end tests across the whole instrumentation stack"]

[tool.coverage.run]
branch = true
source = ["llmobs"]
